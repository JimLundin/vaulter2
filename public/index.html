<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vaulter</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --line: #262b35;
        --text: #e6e8ec;
        --muted: #8b93a1;
        --accent: #6ea8fe;
        --rec: #ff5d5d;
        --ok: #5fd08a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        padding: 16px 20px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .2px; }
      header .sub { color: var(--muted); font-size: 13px; }
      header .warm {
        color: var(--accent); font-size: 13px;
        animation: pulse 1.4s ease-in-out infinite;
      }
      header .warm[hidden] { display: none; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
      header .badge {
        margin-left: auto; color: var(--muted); font: 12px ui-monospace, monospace;
        border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px;
      }
      .card.queued { opacity: .55; }
      .card .status { color: var(--muted); font-size: 13px; margin-top: 8px; }
      main { flex: 1; overflow-y: auto; padding: 20px; }
      #feed { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px 16px;
      }
      .card .transcript { font-weight: 500; }
      .card .agent { color: var(--muted); white-space: pre-wrap; margin-top: 8px; font-size: 14px; }
      .card .tools { margin-top: 8px; display: flex; flex-direction: column; gap: 3px; }
      .tool { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
      .tool b { color: var(--accent); font-weight: 600; }
      .card .summary { margin-top: 10px; color: var(--text); }
      .card .summary .ok { color: var(--ok); }
      .card .commit { color: var(--muted); font: 12px ui-monospace, monospace; margin-left: 6px; }
      .card .sync { font: 12px ui-monospace, monospace; margin-left: 8px; }
      .card .sync.synced { color: var(--ok); }
      .card .sync.failed { color: var(--rec); }
      .card.err { border-color: var(--rec); }
      .card .err-msg { color: var(--rec); margin-top: 8px; }
      .spinner { color: var(--muted); font-size: 13px; margin-top: 8px; }
      footer {
        border-top: 1px solid var(--line);
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      #record {
        border: none;
        border-radius: 999px;
        padding: 14px 28px;
        font-size: 15px;
        font-weight: 600;
        color: #fff;
        background: var(--accent);
        cursor: pointer;
        transition: background .15s, transform .05s;
      }
      #record:active { transform: scale(.98); }
      #record.recording { background: var(--rec); }
      #record:disabled { opacity: .5; cursor: default; }
      #interim { color: var(--muted); min-height: 20px; font-size: 14px; text-align: center; }
      .fallback { max-width: 760px; width: 100%; display: flex; gap: 8px; }
      .fallback textarea {
        flex: 1; background: var(--panel); color: var(--text);
        border: 1px solid var(--line); border-radius: 8px; padding: 10px; resize: vertical;
        font: inherit; min-height: 44px;
      }
      .fallback button {
        background: var(--accent); color: #fff; border: none; border-radius: 8px;
        padding: 0 18px; font-weight: 600; cursor: pointer;
      }
      .notice { color: var(--muted); font-size: 13px; max-width: 760px; text-align: center; }
      .empty { color: var(--muted); text-align: center; margin-top: 40px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Vaulter</h1>
      <span class="sub">speak — Vaulter files it as you go</span>
      <span id="warm" class="warm">· learning your vault…</span>
      <span id="model" class="badge" hidden></span>
    </header>

    <main>
      <div id="feed"><div class="empty">Nothing captured yet. Press record and speak.</div></div>
    </main>

    <footer id="footer">
      <!-- populated by script: either a record button or a typed fallback -->
    </footer>

    <script>
      const feed = document.getElementById("feed");
      const footer = document.getElementById("footer");
      const cards = new Map(); // capture id -> { el, agentEl, toolsEl }

      // --- Feed rendering (driven by SSE) ---
      // Each capture is a card that moves through: queued → filing → done.
      function cardFor(id) {
        let c = cards.get(id);
        if (c) return c;
        document.querySelector(".empty")?.remove();
        const el = document.createElement("div");
        el.className = "card queued";
        const transcript = document.createElement("div");
        transcript.className = "transcript";
        const tools = document.createElement("div");
        tools.className = "tools";
        const agent = document.createElement("div");
        agent.className = "agent";
        const status = document.createElement("div");
        status.className = "status";
        status.textContent = "· queued";
        el.append(transcript, tools, agent, status);
        feed.append(el);
        c = { el, transcriptEl: transcript, agentEl: agent, toolsEl: tools, statusEl: status };
        cards.set(id, c);
        return c;
      }

      function scroll() {
        const m = document.querySelector("main");
        m.scrollTop = m.scrollHeight;
      }

      const es = new EventSource("/events");
      es.onmessage = (e) => {
        const ev = JSON.parse(e.data);
        if (ev.type === "info") {
          const b = document.getElementById("model");
          b.textContent = ev.model;
          b.hidden = false;
          document.getElementById("warm").hidden = !!ev.ready;
          return;
        }
        if (ev.type === "ready") {
          document.getElementById("warm").hidden = true;
          return;
        }
        const c = cardFor(ev.id);
        if (ev.type === "queued") {
          c.transcriptEl.textContent = ev.transcript;
        } else if (ev.type === "start") {
          c.el.classList.remove("queued");
          c.statusEl.textContent = "Vaulter is filing…";
        } else if (ev.type === "text") {
          c.agentEl.textContent += ev.text;
        } else if (ev.type === "tool") {
          const line = document.createElement("div");
          line.className = "tool";
          line.innerHTML = "<b>" + ev.tool + "</b>" + (ev.target ? " " + escapeHtml(ev.target) : "");
          c.toolsEl.append(line);
        } else if (ev.type === "done") {
          c.el.classList.remove("queued");
          c.statusEl.remove();
          c.agentEl.remove();
          const s = document.createElement("div");
          s.className = "summary";
          s.innerHTML = '<span class="ok">✓</span> ' + escapeHtml(ev.summary || "Filed.");
          if (ev.commit) {
            const com = document.createElement("span");
            com.className = "commit";
            com.textContent = ev.commit;
            s.append(com);
          }
          // Sync indicator — only shown when a remote is configured.
          if (ev.sync === "synced" || ev.sync === "failed") {
            const sy = document.createElement("span");
            sy.className = "sync " + ev.sync;
            sy.textContent = ev.sync === "synced" ? "↑ synced" : "⚠ not pushed";
            if (ev.syncDetail) sy.title = ev.syncDetail;
            s.append(sy);
          }
          c.el.append(s);
        } else if (ev.type === "error") {
          c.el.classList.remove("queued");
          c.statusEl?.remove();
          c.el.classList.add("err");
          const m = document.createElement("div");
          m.className = "err-msg";
          m.textContent = "Failed: " + ev.message;
          c.el.append(m);
        }
        scroll();
      };

      function escapeHtml(s) {
        return s.replace(/[&<>"']/g, (ch) => (
          { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]
        ));
      }

      // One recording = one recordingId. There is a SINGLE Vaulter session for
      // the whole server (not per recording); the recordingId only lets the
      // runtime flag when a NEW recording starts, so the agent can tell a fresh
      // topic from a continuation. `final` marks the last chunk of a recording
      // for the UI's own flushing — the runtime does not act on it.
      let recordingId = null;

      async function sendCapture(transcript, final) {
        transcript = (transcript || "").trim();
        if (!transcript && !final) return;
        if (!recordingId) recordingId = String(Date.now()) + "-" + Math.round(Math.random() * 1e6);
        await fetch("/capture", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ recordingId, transcript }),
        });
      }

      // --- Input: Web Speech API, with a typed fallback when unsupported ---
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (SR) {
        const btn = document.createElement("button");
        btn.id = "record";
        btn.textContent = "● Record";
        const interim = document.createElement("div");
        interim.id = "interim";
        footer.append(btn, interim);

        const rec = new SR();
        rec.continuous = true;
        rec.interimResults = true;
        rec.lang = "en-US"; // transcribe in English

        const GAP_MS = 1500; // flush after this much silence — i.e. on a pause
        const MIN_CHUNK_CHARS = 60; // coalesce sub-thought fragments: a pause
        // that leaves less than this much buffered text does NOT flush — the
        // fragment stays buffered and merges with the next pause's speech, so a
        // choppy talker doesn't spray tiny one-fragment Captures (each of which
        // would be its own agent turn and its own git commit).
        let recording = false; // the user's intent to be recording
        let pendingFinal = ""; // finalized transcript not yet sent
        let gapTimer = null;

        // Flush on a pause: re-armed on every speech result, so it only fires
        // once the speaker has gone quiet for GAP_MS — chunking on thought
        // boundaries instead of chopping mid-sentence on a fixed clock.
        function armGap() {
          clearTimeout(gapTimer);
          gapTimer = setTimeout(flush, GAP_MS);
        }

        // Send the finalized speech accumulated so far as one Capture — but only
        // once it's grown to a thought-sized chunk. A shorter fragment stays in
        // pendingFinal (interim keeps showing it) and coalesces with the next
        // pause. flushFinal (on Stop) always sends the remainder, however small,
        // so nothing is ever lost.
        function flush() {
          const chunk = pendingFinal.trim();
          if (chunk.length < MIN_CHUNK_CHARS) return;
          pendingFinal = "";
          interim.textContent = "";
          sendCapture(chunk, false);
        }

        // On stop: send the tail and close the recording's session.
        function flushFinal() {
          clearTimeout(gapTimer);
          const chunk = pendingFinal.trim();
          pendingFinal = "";
          interim.textContent = "";
          if (chunk) sendCapture(chunk, true);
          else if (recordingId) sendCapture("", true);
        }

        btn.onclick = () => {
          if (!recording) {
            recording = true;
            recordingId = null; // a fresh recording → a fresh Vaulter session
            pendingFinal = "";
            interim.textContent = "";
            rec.start();
          } else {
            recording = false;
            rec.stop(); // onend flushes the remainder and clears the timer
          }
        };

        rec.onstart = () => {
          btn.classList.add("recording");
          btn.textContent = "■ Stop";
        };

        rec.onresult = (e) => {
          let live = "";
          for (let i = e.resultIndex; i < e.results.length; i++) {
            const r = e.results[i];
            if (r.isFinal) pendingFinal += r[0].transcript;
            else live += r[0].transcript;
          }
          interim.textContent = (pendingFinal + " " + live).trim();
          armGap(); // (re)start the silence countdown; flush only on a real pause
        };

        rec.onerror = (e) => {
          if (e.error !== "no-speech") interim.textContent = "Mic error: " + e.error;
        };

        rec.onend = () => {
          if (recording) {
            // The browser ended the session (silence/timeout) but the user is
            // still recording — restart so streaming continues uninterrupted.
            try { rec.start(); } catch (_) {}
            return;
          }
          // Stopped by the user: flush the tail, close the session, reset.
          flushFinal();
          btn.classList.remove("recording");
          btn.textContent = "● Record";
        };
      } else {
        const note = document.createElement("div");
        note.className = "notice";
        note.textContent =
          "Voice capture needs the Web Speech API (Chrome or Edge). Your browser doesn't support it — type your capture instead:";
        const wrap = document.createElement("div");
        wrap.className = "fallback";
        const ta = document.createElement("textarea");
        ta.placeholder = "Type a thought to file…";
        const send = document.createElement("button");
        send.textContent = "File";
        // Each typed note is its own one-capture session.
        const submit = () => {
          if (!ta.value.trim()) return;
          recordingId = null;
          sendCapture(ta.value, true);
          ta.value = "";
        };
        send.onclick = submit;
        ta.addEventListener("keydown", (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key === "Enter") submit();
        });
        wrap.append(ta, send);
        footer.append(note, wrap);
      }
    </script>
  </body>
</html>
